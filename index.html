<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | El Despertar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("./img/plata.jpg") no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: fadeIn 0.8s ease-in-out;
    }

    /* Corrected Image Path for Static Demo */
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("./img/plata.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    /* ... rest of styles same ... */

    /* ALERT STYLE hidden by default */
    #demoAlert {
      display: none;
    }
  </style>
  <script>
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('floatingInput').value;
      const password = document.getElementById('floatingPassword').value;
      const alertBox = document.getElementById('demoAlert');

      if (email && password) {
        // Simulate processing
        document.querySelector('.btn-login').innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Ingresando...';
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 800);
      } else {
        alertBox.style.display = 'block';
        alertBox.innerText = 'Por favor complete todos los campos';
      }
    }
  </script>
</head>

<body>

  <div class="login-card">
    <div class="login-header">
      <i class="fas fa-user-shield"></i>
      <h2>Panel Administrativo</h2>
      <p class="text-muted">Inicia sesión para gestionar las reservaciones</p>
    </div>

    <!-- Static Alert -->
    <div id="demoAlert" class="alert alert-danger alert-custom d-flex align-items-center" role="alert">
      <i class="fas fa-exclamation-circle me-2"></i>
      <div>Error de credenciales</div>
    </div>

    <form onsubmit="handleLogin(event)">

      <div class="form-floating">
        <input type="email" class="form-control" id="floatingInput" name="txtCorreo" placeholder="nombre@ejemplo.com"
          value="admin@eldespertar.com" required>
        <label for="floatingInput">Correo Electrónico</label>
      </div>

      <div class="form-floating">
        <input type="password" class="form-control" id="floatingPassword" name="txtPassword" placeholder="Contraseña"
          value="admin123" required>
        <label for="floatingPassword">Contraseña</label>
      </div>

      <button type="submit" class="btn btn-login">
        <i class="fas fa-sign-in-alt me-2"></i> Ingresar (Demo)
      </button>

      <a href="#" class="btn-back">
        <i class="fas fa-arrow-left me-1"></i> Volver a la página principal
      </a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
