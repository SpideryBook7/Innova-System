<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Administrar Reservaciones</title>
  <!-- Use Bootstrap 5 for modern styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* Transparent/Glass Effect Container to keep background visible */
    .glass-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      margin-top: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1,
    h2 {
      color: #a92d03;
      font-weight: 700;
    }

    /* Table Styling */
    .table-responsive {
      border-radius: 10px;
      overflow: hidden;
    }

    .table thead {
      background-color: #a92d03;
      color: white;
    }

    .table thead th {
      border: none;
      padding: 15px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      vertical-align: middle;
    }

    .table tbody tr {
      transition: all 0.2s;
    }

    .table tbody tr:hover {
      background-color: #fff3cd;
    }

    .table td {
      vertical-align: middle;
      font-size: 0.9rem;
    }

    /* Input styling inside table for inline editing */
    .table input {
      border: 1px solid #ced4da;
      border-radius: 5px;
      padding: 5px;
      width: 100%;
      min-width: 80px;
      font-size: 0.85rem;
    }

    .table input:focus {
      border-color: #a92d03;
      box-shadow: 0 0 0 0.2rem rgba(169, 45, 3, 0.25);
      outline: none;
    }

    /* Buttons */
    .btn-action {
      border-radius: 50%;
      width: 35px;
      height: 35px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 2px;
      border: none;
      transition: transform 0.2s;
    }

    .btn-action:hover {
      transform: scale(1.1);
    }

    .btn-update {
      background-color: #ffc107;
      color: #212529;
    }

    .btn-delete {
      background-color: #dc3545;
      color: white;
    }

    /* Forms */
    .search-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 5px solid #a92d03;
    }

    .insert-box {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #dee2e6;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="glass-container">

      <!-- Header & Search -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
        <h1><i class="fas fa-calendar-alt me-2"></i>Gestión de Reservaciones</h1>

        <form action="/ADreservar" method="post" class="d-flex gap-2">
          <input type="text" name="keyword" class="form-control" placeholder="Buscar por nombre o fecha..." required>
          <button type="submit" class="btn btn-outline-danger"><i class="fas fa-search"></i></button>
          <a href="{{ url_for('show_records') }}" class="btn btn-outline-secondary" title="Recargar"><i
              class="fas fa-sync-alt"></i></a>
        </form>
      </div>

      <!-- Table -->
      <div class="table-responsive shadow-sm">
        <table class="table table-hover mb-0 bg-white">
          <thead>
            <tr>
              <th style="width: 50px;">ID</th>
              <th>Huésped</th>
              <th>Contacto</th>
              <th>Cabaña</th>
              <th>Fechas</th>
              <th>Precio</th>
              <th style="width: 100px;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            {% for record in records %}
            <tr>
              <!-- Form wraps the entire row for update logic -->
              <form action="/update/{{ record[0] }}" method="post">
                <td><span class="badge bg-secondary">{{ record[0] }}</span></td>

                <td>
                  <input type="text" name="nombre" value="{{ record[1] }}" class="mb-1" placeholder="Nombre" required>
                  <input type="text" name="apellidos" value="{{ record[2] }}" placeholder="Apellidos" required>
                </td>

                <td>
                  <input type="email" name="correo" value="{{ record[3] }}" class="mb-1" placeholder="Email" required>
                  <input type="number" name="telefono" value="{{ record[4] }}" placeholder="Tel" required>
                </td>

                <td>
                  <input type="text" name="nombre_cabana" value="{{ record[6] }}" required>
                </td>

                <td>
                  <div class="input-group input-group-sm mb-1">
                    <span class="input-group-text">In</span>
                    <input type="date" name="Fecha" value="{{ record[5] }}" required>
                  </div>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text">Out</span>
                    <input type="date" name="fecha_de_salida" value="{{ record[7] }}" required>
                  </div>
                </td>

                <td>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text">$</span>
                    <input type="number" name="precio" value="{{ record[8] }}" required style="width: 70px;">
                  </div>
                </td>

                <td>
                  <div class="d-flex gap-1 justify-content-center">
                    <button type="submit" class="btn-action btn-update" title="Actualizar"
                      onclick="return confirm('¿Confirmar cambios?')">
                      <i class="fas fa-save"></i>
                    </button>
              </form> <!-- Close Update Form -->

              <form action="/delete/{{ record[0] }}" method="post" style="display:inline;">
                <button type="submit" class="btn-action btn-delete" title="Eliminar"
                  onclick="return confirm('¿Estás seguro de eliminar esta reservación?')">
                  <i class="fas fa-trash-alt"></i>
                </button>
      </div>
      </form>
      </td>
      </tr>
      {% endfor %}
      </tbody>
      </table>
    </div>

    {% if not records %}
    <div class="alert alert-info text-center mt-3">
      No se encontraron reservaciones.
    </div>
    {% endif %}

    <!-- Add New Record Section -->
    <div class="insert-box mt-5">
      <h3 class="mb-4 text-secondary"><i class="fas fa-plus-circle me-2"></i>Nueva Reservación</h3>
      <form action="/insert" method="post" class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Nombre</label>
          <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Apellidos</label>
          <input type="text" name="apellidos" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Teléfono</label>
          <input type="number" name="telefono" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Correo</label>
          <input type="email" name="correo" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Cabaña</label>
          <select name="nombre_cabana" class="form-select" required>
            <option value="Bonita">Bonita</option>
            <option value="Golosa">Golosa</option>
            <option value="Consentida">Consentida</option>
            <option value="Coqueta">Coqueta</option>
            <option value="Groseras">Groseras</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Check-In</label>
          <input type="date" name="Fecha" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Check-Out</label>
          <input type="date" name="fecha_de_salida" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Precio</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" name="precio" class="form-control" value="150" required>
          </div>
        </div>

        <div class="col-12 text-end mt-4">
          <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">Guardar Registro</button>
        </div>
      </form>
    </div>

    <!-- Footer Actions -->
    <div class="mt-4 text-center">
      <a href="{{ url_for('admin') }}" class="btn btn-secondary px-4">
        <i class="fas fa-arrow-left me-2"></i>Volver al Panel
      </a>
    </div>

  </div>
  </div>

</body>

</html>
