<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <title>Inicio de Sesion</title>
</head>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          background-image: url("../static/img/plata.jpg");
        }
    
        h1 {
          text-align: center;
          font-weight: bold;
      
        }

        label {
          font-weight: bold;
          
        }

        form {
          display: flex;
          text-align: center;
          justify-content: center; /* Centrar horizontalmente */
          align-items: center;
          margin-top: 10px;
        }

        .caja{
            margin-left: 20%;
            margin-right: 20%;
            margin-top: 15%;
        }

        .btn {
          display: inline-block;
          background-color: #ddd;
          border: 2px solid #f7d08f;
          color: #000000;
          padding: 6px 6px;
          text-decoration: none;
          font-size: 16px;
          border-radius: 4px;
        }

        .btn:hover {
          background-color: #f7d08f;
        }

    </style>

    <div class="caja">
        <form class="form-control" action="/acceso-login" method="post">
            <h1>Inicio de Sesion</h1>
            <div class="alert alert-danger" role="alert">
                {% if mensaje %}
            {{ mensaje }}
            {% endif %}
              </div>
            
            
            <div class="form-group">
              <label for="exampleInputEmail1">Dirección de Correo</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Ingresar Correo" name="txtCorreo">
              <small id="emailHelp" class="form-text text-muted">No compartas tu correo.</small>
            </div>
            <div class="form-group">
              <label for="exampleInputPassword1">Contraseña</label>
              <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña" name="txtPassword">
              <small id="emailHelp" class="form-text text-muted">No compartas tu Contraseña.</small>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">recordarme</label>
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
            <a href="/reservar/" class="btn">Regresar.</a>

          </form>
        </div>
</body>
</html>
