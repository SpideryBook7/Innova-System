<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | El Despertar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("../static/img/plata.jpg") no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header i {
      font-size: 3rem;
      color: #a92d03;
      background: rgba(169, 45, 3, 0.1);
      padding: 20px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .login-header h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #333;
    }

    .form-floating {
      margin-bottom: 20px;
    }

    .form-control {
      border-radius: 10px;
      border: 1px solid #ddd;
      height: 55px;
    }

    .form-control:focus {
      border-color: #a92d03;
      box-shadow: 0 0 0 0.25rem rgba(169, 45, 3, 0.25);
    }

    .btn-login {
      background: linear-gradient(45deg, #a92d03, #ff6a00);
      border: none;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-weight: 600;
      width: 100%;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(169, 45, 3, 0.4);
      color: white;
    }

    .btn-back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6c757d;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .btn-back:hover {
      color: #333;
    }

    .alert-custom {
      border-radius: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="login-header">
      <i class="fas fa-user-shield"></i>
      <h2>Panel Administrativo</h2>
      <p class="text-muted">Inicia sesión para gestionar las reservaciones</p>
    </div>

    {% if mensaje %}
    <div class="alert alert-danger alert-custom d-flex align-items-center" role="alert">
      <i class="fas fa-exclamation-circle me-2"></i>
      <div>{{ mensaje }}</div>
    </div>
    {% endif %}

    <form action="/acceso-login" method="post">

      <div class="form-floating">
        <input type="email" class="form-control" id="floatingInput" name="txtCorreo" placeholder="nombre@ejemplo.com"
          required>
        <label for="floatingInput">Correo Electrónico</label>
      </div>

      <div class="form-floating">
        <input type="password" class="form-control" id="floatingPassword" name="txtPassword" placeholder="Contraseña"
          required>
        <label for="floatingPassword">Contraseña</label>
      </div>

      <button type="submit" class="btn btn-login">
        <i class="fas fa-sign-in-alt me-2"></i> Ingresar
      </button>

      <a href="/inicio/" class="btn-back">
        <i class="fas fa-arrow-left me-1"></i> Volver a la página principal
      </a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
